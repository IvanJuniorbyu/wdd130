<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário HTML</title>
</head>

<body>
    <header>WDD 130 | Formulário HTML - Enquete do Usuário</header>
    <main>
        <form>
            <label for="nomecompleto">Nome Completo:</label>
            <input type="text" id="nome-completo" name="nome-completo" required>

            <label for="email">email:</label>
            <input type="email" id="emaildousuario" name="emaildousuario" required>

            <label for="navegador">Qual é o seu navegador favorito? </label>
            <select name="navegador" id="navegador">
                <option value="google">Google</option>
                <option value="safari">Safari</option>
                <option value="edge">Edge</option>
                <option value="brave">Brave</option>
                <option value="outro">Outro</option>
            </select>
            <label for="pet">Você tem um bichinho de estimação em casa?</label>
            <input type="checkbox" id="pet" name="pet">
            <label for="feedback">Liste os lugares onde você morou:</label>
            <textarea name="feedback" id="feedback" rows="4"
              placeholder="Steelwater Flórida, Amsterdã Holanda, Tibuktu Mali"></textarea>
            <button type="submit">Enviar Pesquisa</button>
        </form>
    </main>
    <footer>©2026 | Formulário HTML - Atividade de Enquete do Usuário | Ivan Rodrigues Silva Junior
    </footer>

</body>

</html>
