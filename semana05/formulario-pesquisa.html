<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário HTML</title>
    <link rel="stylesheet" href="estilos/formulario-pesquisa.css">
</head>

<body>
    <header>
        <h1>WDD 130 | Formulário HTML - Enquete do Usuário</h1>
    </header>

    <main>
        <form>
            <div class="item-formulario coluna2">
                <label for="nomecompleto">Nome Completo:</label>
                <input type="text" id="nomecompleto" name="nomecompleto">
            </div>

            <div class="item-formulario coluna2">
                <label for="emaildousuario">E-mail:</label>
                <input type="email" id="emaildousuario" name="emaildousuario">
            </div>

            <div class="item-formulario coluna1">
                <label for="navegador">Qual é o seu navegador favorito?</label>
                <select name="navegador" id="navegador">
                    <option value="google">Google</option>
                    <option value="safari">Safari</option>
                    <option value="edge">Edge</option>
                    <option value="brave">Brave</option>
                    <option value="outro">Outro</option>
                </select>
            </div>

            <div class="item-formulario coluna1">
                <label for="pet">Você tem um bichinho de estimação em casa?</label>
                <input type="checkbox" id="pet" name="pet">
            </div>

            <div class="item-formulario">
                <label for="feedback">Liste os lugares onde você morou:</label>
                <textarea name="feedback" id="feedback" rows="4"
                  placeholder="Steelwater Flórida, Amsterdã Holanda, Tibuktu Mali"></textarea>
            </div>

            <button type="submit">Enviar Pesquisa</button>
        </form>
    </main>

    <footer>
        ©2026 | Formulário HTML - Atividade de Enquete do Usuário | Ivan Rodrigues Silva Junior
    </footer>
</body>

</html>
