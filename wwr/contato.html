<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Página de rafting para guerreiros que gostam de explorar e se desafiar na natureza, além de apreciar lindas paisagens naturais.">
    <meta name="author" content="Ivan Rodrigues Silva junior.">
    <title>Sobre Nós - Rafting Adventure</title>
    <link rel="stylesheet" href="estilos/rafting.css">
</head>

<body>
    <header>
        <img src="imagens/logo.webp" alt="logo de rafting">
        <nav>
            <a href="index.html">Página Inicial</a>
            <a href="sobre.html">Sobre Nós</a>
            <a href="passeios.html">Passeios</a>
            <a href="contato.html">Fale Conosco</a>
        </nav>
    </header>
    <main>
        <section class="contatos">
            <h1>Companhia de Rafting em Corredeiras</h1>
            <p>123 Rua Principal do Rio</p>
            <p>Foz do Iguaçu, Parana</p>
            <p>+55 45 99999-9999</p>
            <p>info@correiras.com</p>
        </section>
        <section class="local">
            <div class="mapa"><iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d77037.79542747453!2d-54.587985987210786!3d-25.518449108229543!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94f690ebae530a43%3A0x21979473b4c4a952!2sFoz%20do%20Igua%C3%A7u%2C%20PR!5e1!3m2!1spt-BR!2sbr!4v1790975986859!5m2!1spt-BR!2sbr"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin" frameborder="0"></iframe></div>
            <form action="">
                <div class="form">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" required>

                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>

                    <div class="radio">
                        <div class="opcao">
                            <input type="radio" id="consulta" name="pergunta">
                            <label for="consulta">Consulta Geral</label>
                        </div>

                        <div class="opcao">
                            <input type="radio" id="reserva" name="pergunta">
                            <label for="reserva">Pergunta sobre Reserva</label>
                        </div>

                        <div class="opcao">
                            <input type="radio" id="sugestao" name="pergunta">
                            <label for="sugestao">Sugestão de Site</label>
                        </div>
                    </div>

                    <label for="mensagem">Mensagem</label>
                    <textarea name="mensagem" id="mensagem" rows="4"
                      placeholder="Escreva aqui..."></textarea>

                    <label for="newsletter">Quero receber newsletter mensal.</label>
                    <input type="checkbox" id="newsletter" name="newsletter">

                    <button type="submit">Entrar em Contato!</button>
                </div>
            </form>
        </section>
        <section class="equipe">
            <h2>Estamos Aqui para Servi-lo</h2>
            <figure><img src="imagens/funcionario-1.jpg" alt="funcionario-1">
                <figcaption>Joao Paulo - Atendimento ao Cliente</figcaption>
            </figure>
            <figure><img src="imagens/funcionario-2.jpg" alt="funcionario-2">
                <figcaption>Ivani Torres - Instrutora de Segurança</figcaption>
            </figure>
            <figure><img src="imagens/funcionario-3.jpg" alt="funcionario-3">
                <figcaption>Ana Paula - Guia de Rafting</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>©️ 2026 - Rafting Adventure - Ivan Rodrigues Silva Junior</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="imagens/icone-facebook.svg"
                  alt="ícone facebook"></a>
            <a href="https://instagram.com"><img src="imagens/icone-instagram.svg"
                  alt="ícone instagram"></a>
            <a href="https://linkedin.com"><img src="imagens/icone-linkedin.svg"
                  alt="ícone linkedin"></a>

        </nav>
    </footer>
</body>

</html>
